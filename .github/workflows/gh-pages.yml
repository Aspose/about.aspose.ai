name: github-pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout about.aspose.ai repo
        uses: actions/checkout@main
        with:
          #submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2.4.13
        with:
          hugo-version: '0.101.0'
          extended: true
      
      - name: Build
        run: hugo --config "config.yml" --cleanDestinationDir --minify
    
      - name: Deploy About to S3
        # run: hugo deploy --maxDeletes -1 --target "production"
        run: hugo deploy --maxDeletes -1 --target "production"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}

      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          PATHS: '/*'
          AWS_REGION: 'us-west-2'
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}

      - name: Purge BunnyCDN Cache
        run: |
          for url in \
            "https://about.aspose.ai/" \
            "https://about.aspose.ai/contact/" \
            "https://about.aspose.ai/index.html"
          do
            curl -siG \
              -H "X-Api-Key: ${{ secrets.BUNNY_API_KEY }}" \
              --data-urlencode "url=${url}" \
              "https://api.dynabic.com/bn/purge?async=true"
          done