name: github-pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout about.aspose.ai repo
        uses: actions/checkout@main
        with:
          #submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2.4.13
        with:
          hugo-version: '0.101.0'
          extended: true
      
      - name: Build
        run: hugo --config "config.yml" --cleanDestinationDir --minify
    
      - name: Deploy About to S3
        # run: hugo deploy --maxDeletes -1 --target "production"
        run: hugo deploy --maxDeletes -1 --target "production"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}

      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          PATHS: '/*'
          AWS_REGION: 'us-west-2'
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}

      - name: Purge BunnyCDN Cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          if [ -z "$BUNNY_API_KEY" ]; then
            echo "BUNNY_API_KEY secret is not set on this repository"
            exit 1
          fi
          ok=0
          for url in \
            "https://about.aspose.ai" \
            "https://about.aspose.ai/" \
            "https://about.aspose.ai/index.html" \
            "https://about.aspose.ai/contact/" \
            "https://about-aspose-ai.b-cdn.net/"
          do
            code=$(curl -sS -o /tmp/purge-body.txt -w "%{http_code}" -G \
              -H "X-Api-Key: ${BUNNY_API_KEY}" \
              --data-urlencode "url=${url}" \
              "https://api.dynabic.com/bn/purge?async=true")
            echo "dynabic purge ${url} -> HTTP ${code}"
            case "$code" in 2*|3*) ok=1 ;; esac
          done
          if [ "$ok" -ne 1 ]; then
            echo "CDN purge failed; live about.aspose.ai/ will stay on the cached HTML"
            exit 1
          fi